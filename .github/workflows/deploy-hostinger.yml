# Mise en production sur Hostinger, déclenchée à la main :
# GitHub → onglet Actions → « Déployer sur Hostinger » → Run workflow.
# Secrets à créer une fois (Settings → Secrets and variables → Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (hPanel Hostinger → Fichiers → Comptes FTP)
name: Déployer sur Hostinger

on:
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Envoi des fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            docs/*.md
            .nojekyll
